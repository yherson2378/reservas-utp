<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Cubículos UTP</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: #333; text-align: center; }
        .form-group { margin-bottom: 1rem; display: flex; flex-direction: column; }
        label { margin-bottom: 0.5rem; color: #666; font-weight: bold; }
        input, select { padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #d10024; color: white; border: none; padding: 0.75rem; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #a3001c; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Reserva tu Cubículo</h2>
        <form>
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" placeholder="Ingresa tu nombre" required>
            </div>
            <div class="form-group">
                <label for="cubiculo">Cubículo</label>
                <select id="cubiculo" required>
                    <option value="1">Cubículo A (Piso 1)</option>
                    <option value="2">Cubículo B (Piso 2)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="fecha">Fecha y Hora</label>
                <input type="datetime-local" id="fecha" required>
            </div>
            <button type="button">Confirmar Reserva</button>
        </form>
    </div>
</body>
</html>
